<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EZ Heart Zones — Day Detail</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:#FAF9F6}
button{font-family:inherit;border:none;background:none;padding:0;margin:0;cursor:pointer}
svg{display:block}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF9F6; display: flex; flex-direction: column; padding: 22px 20px 24px 20px; gap: 20px; color: #1F2430">

  <div style="display:flex; align-items:center; gap:10px">
    <button aria-label="Back to this week" style="width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:9px; background:#EFF0EC">
      <svg width="8" height="13" viewBox="0 0 9 15" fill="none" stroke="#1F2430" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1 1 7.5 8 14"/></svg>
    </button>
    <div>
      <div style="font-size:18px; font-weight:700">Wed, Sep 23</div>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:7px; background:#FFFFFF; border:1px solid #E8E5DE; border-radius:14px; padding:12px 14px">
    <div style="font-size:10px; font-weight:700; letter-spacing:0.6px; color:#8B8F98; text-transform:uppercase">Medium vs High Intensity</div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; font-size:12px">
      <span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#8D7EC7;margin-right:5px"></span>Medium · 10 pts (38%)</span>
      <span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#4F3F87;margin-right:5px"></span>High · 16 pts (62%)</span>
    </div>
    <div style="height:9px; border-radius:5px; overflow:hidden; display:flex">
      <div style="width:38%; height:100%; background:#8D7EC7"></div>
      <div style="width:62%; height:100%; background:#4F3F87"></div>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; align-items:center">
    <div style="position:relative; width:150px; height:150px">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="58" fill="none" stroke="#4CAF8C" stroke-width="14" stroke-dasharray="140.2 364.4" stroke-dashoffset="0" transform="rotate(-90 75 75)"/>
        <circle cx="75" cy="75" r="58" fill="none" stroke="#E8934A" stroke-width="14" stroke-dasharray="224.2 364.4" stroke-dashoffset="-140.2" transform="rotate(-90 75 75)"/>
      </svg>
      <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center">
        <div style="font-size:30px; font-weight:700; line-height:1">26</div>
        <div style="font-size:12px; color:#8B8F98">points</div>
      </div>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:2px">
    <div style="font-size:11px; font-weight:700; letter-spacing:0.6px; color:#8B8F98; text-transform:uppercase; margin-bottom:6px">By Zone · Low to High</div>

    <div style="display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid #EEECE6; opacity:0.55">
      <div style="display:flex; align-items:center; gap:8px"><span style="width:9px;height:9px;border-radius:50%;background:#A8B3C4"></span><span style="font-size:13px; font-weight:600">Zone 1</span><span style="font-size:11px; color:#8B8F98">0× (not counted)</span></div>
      <div style="display:flex; align-items:baseline; flex-shrink:0">
        <span class="mono" style="width:46px; text-align:left; font-size:12px; color:#8B8F98">6 min</span>
        <span class="mono" style="width:50px; text-align:right; font-size:13px; color:#8B8F98">0 pts</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid #EEECE6">
      <div style="display:flex; align-items:center; gap:8px"><span style="width:9px;height:9px;border-radius:50%;background:#5B9BD5"></span><span style="font-size:13px; font-weight:600">Zone 2</span><span style="font-size:11px; color:#8B8F98">Light · 1×</span></div>
      <div style="display:flex; align-items:baseline; flex-shrink:0">
        <span class="mono" style="width:46px; text-align:left; font-size:12px; color:#8B8F98">0 min</span>
        <span class="mono" style="width:50px; text-align:right; font-size:13px; font-weight:700; color:#8B8F98">0 pts</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid #EEECE6">
      <div style="display:flex; align-items:center; gap:8px"><span style="width:9px;height:9px;border-radius:50%;background:#4CAF8C"></span><span style="font-size:13px; font-weight:600">Zone 3</span><span style="font-size:11px; color:#8B8F98">Moderate · 1×</span></div>
      <div style="display:flex; align-items:baseline; flex-shrink:0">
        <span class="mono" style="width:46px; text-align:left; font-size:12px; color:#8B8F98">10 min</span>
        <span class="mono" style="width:50px; text-align:right; font-size:13px; font-weight:700">10 pts</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid #EEECE6">
      <div style="display:flex; align-items:center; gap:8px"><span style="width:9px;height:9px;border-radius:50%;background:#E8934A"></span><span style="font-size:13px; font-weight:600">Zone 4</span><span style="font-size:11px; color:#8B8F98">Hard · 2×</span></div>
      <div style="display:flex; align-items:baseline; flex-shrink:0">
        <span class="mono" style="width:46px; text-align:left; font-size:12px; color:#8B8F98">8 min</span>
        <span class="mono" style="width:50px; text-align:right; font-size:13px; font-weight:700">16 pts</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; padding:9px 0">
      <div style="display:flex; align-items:center; gap:8px"><span style="width:9px;height:9px;border-radius:50%;background:#D9564B"></span><span style="font-size:13px; font-weight:600">Zone 5</span><span style="font-size:11px; color:#8B8F98">Maximum · 2×</span></div>
      <div style="display:flex; align-items:baseline; flex-shrink:0">
        <span class="mono" style="width:46px; text-align:left; font-size:12px; color:#8B8F98">0 min</span>
        <span class="mono" style="width:50px; text-align:right; font-size:13px; font-weight:700; color:#8B8F98">0 pts</span>
      </div>
    </div>
  </div>

</div>
</body>
</html>
