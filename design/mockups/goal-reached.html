<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EZ Heart Zones — Goal Reached (Zoomie)</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:#FAF9F6}
button{font-family:inherit;border:none;background:none;padding:0;margin:0;cursor:pointer}
svg{display:block}

@keyframes zoomieSpin{0%,100%{transform:rotate(-10deg) scale(1)}30%{transform:rotate(12deg) scale(1.08)}60%{transform:rotate(-4deg) scale(0.95)}}
@keyframes armSwingL2{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(30deg)}}
@keyframes armSwingR2{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-30deg)}}
@keyframes legKickL2{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-18deg)}}
@keyframes legKickR2{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(18deg)}}
.zoomie-body{animation:zoomieSpin 0.9s ease-in-out infinite; transform-origin:40px 40px}
.arm-l2{animation:armSwingL2 0.75s ease-in-out infinite; transform-origin:5px 28px}
.arm-r2{animation:armSwingR2 0.75s ease-in-out infinite; transform-origin:75px 28px}
.leg-l2{animation:legKickL2 0.75s ease-in-out infinite; transform-origin:18px 70px}
.leg-r2{animation:legKickR2 0.75s ease-in-out infinite; transform-origin:62px 70px}

/* NOTE: confetti here loops (`infinite`) purely so it's always visible when you
   open this file standalone. In the real app, fire it as a single ~1.6s burst
   per appearance of the celebration state instead of looping — see DESIGN.md §8. */
@keyframes confettiFloat{0%{transform:translateY(0) rotate(0deg); opacity:0}18%{opacity:1}100%{transform:translateY(-50px) rotate(200deg); opacity:0}}
.confetti{position:absolute; animation:confettiFloat 1.7s ease-in-out infinite}

@keyframes shimmer{0%{left:-40%}100%{left:120%}}
.shimmer{position:absolute; top:0; left:-40%; width:30%; height:100%; background:rgba(255,255,255,0.4); transform:skewX(-20deg); animation:shimmer 2.1s ease-in-out infinite}
</style>
</head>
<body>
<div style="width: 390px; height: 400px; box-sizing: border-box; background: #FAF9F6; display: flex; flex-direction: column; padding: 22px 20px 16px 20px; gap: 13px; color: #1F2430; overflow: hidden">

  <div style="display:flex; align-items:center; justify-content:space-between; height:32px; flex-shrink:0">
    <div style="font-size:20px; font-weight:700; letter-spacing:-0.2px">Heart Zones</div>
    <button aria-label="Settings" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:#F0EEE7">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6472" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1z"/>
      </svg>
    </button>
  </div>

  <div style="display:flex; align-items:center; justify-content:space-between; height:36px; flex-shrink:0">
    <button aria-label="Previous week" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:10px">
      <svg width="9" height="15" viewBox="0 0 10 16" fill="none" stroke="#1F2430" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1 1 8l8 7"/></svg>
    </button>
    <div style="text-align:center">
      <div style="font-size:15px; font-weight:600">This Week</div>
      <div style="font-size:12px; color:#8B8F98; margin-top:1px">Sep 21 – 27</div>
    </div>
    <button aria-label="Next week" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:10px">
      <svg width="9" height="15" viewBox="0 0 10 16" fill="none" stroke="#C7C4BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l8 7-8 7"/></svg>
    </button>
  </div>

  <div style="position:relative; margin-top:40px; flex-shrink:0">

    <div class="confetti" style="left:6px; top:-34px; width:8px; height:8px; border-radius:50%; background:#2E7D6B; animation-delay:0s"></div>
    <div class="confetti" style="left:26px; top:-22px; width:6px; height:6px; border-radius:2px; background:#FFC94A; animation-delay:0.3s"></div>
    <div class="confetti" style="left:54px; top:-40px; width:7px; height:7px; border-radius:50%; background:#5B9BD5; animation-delay:0.55s"></div>
    <div class="confetti" style="right:70px; top:-30px; width:6px; height:6px; border-radius:2px; background:#FF6F91; animation-delay:0.8s"></div>
    <div class="confetti" style="right:14px; top:-18px; width:7px; height:7px; border-radius:50%; background:#FFC94A; animation-delay:0.2s"></div>
    <div class="confetti" style="right:40px; top:-42px; width:6px; height:6px; border-radius:2px; background:#2E7D6B; animation-delay:0.65s"></div>

    <div style="position:absolute; right:0px; top:-56px; width:80px; height:88px; z-index:2">
      <svg viewBox="0 0 80 90" width="80" height="88">
        <g class="zoomie-body">
          <g class="arm-l2"><line x1="5" y1="28" x2="-14" y2="10" stroke="#FFC94A" stroke-width="9" stroke-linecap="round"/></g>
          <g class="arm-r2"><line x1="75" y1="28" x2="94" y2="10" stroke="#FFC94A" stroke-width="9" stroke-linecap="round"/></g>
          <g class="leg-l2"><line x1="18" y1="70" x2="10" y2="88" stroke="#F0A93A" stroke-width="9" stroke-linecap="round"/></g>
          <g class="leg-r2"><line x1="62" y1="70" x2="70" y2="88" stroke="#F0A93A" stroke-width="9" stroke-linecap="round"/></g>
          <path d="M40,4 L49,28 L75,28 L54,44 L62,70 L40,54 L18,70 L26,44 L5,28 L31,28 Z" fill="#FFC94A"/>
          <circle cx="30" cy="38" r="5.5" fill="#FFFFFF"/>
          <circle cx="31" cy="39" r="2.4" fill="#1F2430"/>
          <circle cx="50" cy="38" r="5.5" fill="#FFFFFF"/>
          <circle cx="51" cy="39" r="2.4" fill="#1F2430"/>
          <ellipse cx="25" cy="48" rx="6" ry="3.4" fill="#FFDD9E" opacity="0.9"/>
          <ellipse cx="55" cy="48" rx="6" ry="3.4" fill="#FFDD9E" opacity="0.9"/>
          <path d="M31,51 Q40,58 49,51" stroke="#1F2430" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <div style="background:#FFFFFF; border:1px solid #E8E5DE; border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; position:relative; z-index:1">
      <div style="display:flex; align-items:center; justify-content:space-between">
        <span style="font-size:11px; font-weight:700; letter-spacing:0.6px; color:#8B8F98; text-transform:uppercase">Weekly Cardio Goal</span>
        <svg width="7" height="12" viewBox="0 0 7 12" fill="none" stroke="#C7C4BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l5 5-5 5"/></svg>
      </div>
      <div style="display:flex; align-items:baseline; gap:6px">
        <span style="font-size:32px; font-weight:700; line-height:1">162</span>
        <span style="font-size:15px; color:#8B8F98">/ 150 pts</span>
        <span style="font-size:11px; font-weight:700; color:#FFFFFF; background:#2E7D6B; border-radius:20px; padding:2px 8px; margin-left:2px">+12</span>
      </div>
      <div style="position:relative; height:10px; border-radius:6px; background:#EEECE6; overflow:hidden">
        <div style="position:relative; width:100%; height:100%; background:#2E7D6B; border-radius:6px; overflow:hidden">
          <div class="shimmer"></div>
        </div>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between">
        <span style="font-size:14px; font-weight:700; color:#2E7D6B">Goal reached — nice work!</span>
        <span style="font-size:13px; color:#8B8F98">108%</span>
      </div>
    </div>
  </div>

  <div style="font-size:11px; font-weight:700; letter-spacing:0.6px; color:#8B8F98; text-transform:uppercase; flex-shrink:0">Daily Breakdown</div>

</div>
</body>
</html>
